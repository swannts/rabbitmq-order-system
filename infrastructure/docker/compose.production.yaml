name: order-platform

services:
  order-service:
    image: ${ORDER_SERVICE_IMAGE:?Set ORDER_SERVICE_IMAGE to a versioned image}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: ${ORDER_DATABASE_URL:?Set ORDER_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DATABASE_USER:?Set ORDER_DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DATABASE_PASSWORD:?Set ORDER_DATABASE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:?Set RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5671}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_ORDER_SASL_USERNAME:?Set KAFKA_ORDER_SASL_USERNAME}" password="${KAFKA_ORDER_SASL_PASSWORD:?Set KAFKA_ORDER_SASL_PASSWORD}";'

  payment-service:
    image: ${PAYMENT_SERVICE_IMAGE:?Set PAYMENT_SERVICE_IMAGE to a versioned image}
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${PAYMENT_APP_KEY:?Set PAYMENT_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${PAYMENT_DATABASE_HOST:?Set PAYMENT_DATABASE_HOST}
      DB_PORT: ${PAYMENT_DATABASE_PORT:-3306}
      DB_DATABASE: ${PAYMENT_DATABASE_NAME:?Set PAYMENT_DATABASE_NAME}
      DB_USERNAME: ${PAYMENT_DATABASE_USER:?Set PAYMENT_DATABASE_USER}
      DB_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:?Set PAYMENT_DATABASE_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Set RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5671}
      RABBITMQ_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_SCHEME: amqps

  payment-api:
    image: ${PAYMENT_SERVICE_IMAGE:?Set PAYMENT_SERVICE_IMAGE to a versioned image}
    init: true
    restart: unless-stopped
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    expose:
      - "8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${PAYMENT_APP_KEY:?Set PAYMENT_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${PAYMENT_DATABASE_HOST:?Set PAYMENT_DATABASE_HOST}
      DB_PORT: ${PAYMENT_DATABASE_PORT:-3306}
      DB_DATABASE: ${PAYMENT_DATABASE_NAME:?Set PAYMENT_DATABASE_NAME}
      DB_USERNAME: ${PAYMENT_DATABASE_USER:?Set PAYMENT_DATABASE_USER}
      DB_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:?Set PAYMENT_DATABASE_PASSWORD}
  inventory-service:
    image: ${INVENTORY_SERVICE_IMAGE:?Set INVENTORY_SERVICE_IMAGE to a versioned image}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${INVENTORY_MONGODB_URI:?Set INVENTORY_MONGODB_URI with replica-set support}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL using amqps}
    expose:
      - "3000"

  order-history-service:
    image: ${ORDER_HISTORY_SERVICE_IMAGE:?Set ORDER_HISTORY_SERVICE_IMAGE to a versioned image}
    init: true
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: ${HISTORY_CLICKHOUSE_URL:?Set HISTORY_CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${HISTORY_CLICKHOUSE_USER:?Set HISTORY_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${HISTORY_CLICKHOUSE_PASSWORD:?Set HISTORY_CLICKHOUSE_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${KAFKA_HISTORY_SASL_USERNAME:?Set KAFKA_HISTORY_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_HISTORY_SASL_PASSWORD:?Set KAFKA_HISTORY_SASL_PASSWORD}
    expose:
      - "8081"

