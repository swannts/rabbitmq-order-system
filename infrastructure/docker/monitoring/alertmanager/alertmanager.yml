route:
  receiver: local-email
  group_by: [alertname, job, instance]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: local-email
    email_configs:
      - to: alerts@order-platform.local
        from: alertmanager@order-platform.local
        smarthost: mailpit:1025
        require_tls: false
