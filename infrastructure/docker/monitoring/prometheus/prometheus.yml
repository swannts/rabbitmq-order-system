global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]

  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: [inventory-service:3000]

  - job_name: order-history-service
    metrics_path: /metrics
    static_configs:
      - targets: [order-history-service:8081]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: mysql
    static_configs:
      - targets: [mysqld-exporter:9104]

  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: clickhouse
    static_configs:
      - targets: [history-db:9363]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: service-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://order-service:8080/actuator/health
          - http://inventory-service:3000/healthz
          - http://order-history-service:8081/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: rabbitmq-probe
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [rabbitmq:5672]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
